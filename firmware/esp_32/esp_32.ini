/*
 * ChildSafe Tracker - ESP32 firmware v1.0
 * GPS (NEO-6M on UART2) + debounced SOS interrupt + Wi-Fi/MQTT with
 * non-blocking reconnect backoff. No delay() anywhere in loop().
 */
#include <WiFi.h>
#include <PubSubClient.h>
#include <TinyGPSPlus.h>
#include <ArduinoJson.h>

// ===================== USER CONFIG =====================
static const char*    WIFI_SSID = "YOUR_WIFI_SSID";       // phone hotspot works too
static const char*    WIFI_PASS = "YOUR_WIFI_PASSWORD";
static const char*    MQTT_HOST = "broker.hivemq.com";    // public test broker
static const uint16_t MQTT_PORT = 1883;
static const char*    DEVICE_ID = "kid01-change-me-7f3a"; // MAKE THIS UNIQUE (public broker!)

// ======================== PINS =========================
constexpr uint8_t PIN_SOS    = 27;  // button to GND, internal pull-up
constexpr uint8_t PIN_GPS_RX = 16;  // ESP32 RX2 <- GPS TXD
constexpr uint8_t PIN_GPS_TX = 17;  // ESP32 TX2 -> GPS RXD
constexpr uint8_t PIN_LED    = 2;   // onboard LED (status)

// ====================== TIMING (ms) ====================
constexpr uint32_t GPS_BAUD          = 9600;
constexpr uint32_t ISR_LOCKOUT_MS    = 50;     // ignore edges within 50 ms (contact bounce)
constexpr uint32_t CONFIRM_MS        = 30;     // pin must still be LOW 30 ms later (noise filter)
constexpr uint32_t TELEMETRY_MS      = 5000;   // normal publish interval
constexpr uint32_t TELEMETRY_SOS_MS  = 2000;   // faster while SOS is active
constexpr uint32_t SOS_WINDOW_MS     = 30000;  // SOS flag stays true this long after delivery
constexpr uint32_t DEBUG_MS          = 5000;
constexpr uint32_t BACKOFF_MIN       = 1000;
constexpr uint32_t BACKOFF_MAX       = 30000;

// ===================== OBJECTS/STATE ===================
HardwareSerial gpsSerial(2);
TinyGPSPlus    gps;
WiFiClient     net;
PubSubClient   mqtt(net);

char topicTelemetry[96];
char topicStatus[96];

// SOS state (ISR -> loop handoff)
volatile bool     sosIsrFlag  = false;
volatile uint32_t sosIsrLastMs = 0;
bool     sosConfirming      = false;
uint32_t sosConfirmAt       = 0;
bool     sosActive          = false;   // included in telemetry as "sos"
bool     sosPendingDelivery = false;   // true until one SOS packet was really published
uint32_t sosUntil           = 0;
uint32_t sosCount           = 0;       // increments per confirmed press ("sos_n")
bool     forcePublish       = false;

// Connectivity state
uint32_t lastWifiAttempt = 0, wifiBackoff = BACKOFF_MIN;
uint32_t lastMqttAttempt = 0, mqttBackoff = 2000;
uint32_t lastPublish = 0, lastDebug = 0;

// ================== SOS INTERRUPT (ISR) ================
// Keep it tiny: leading-edge lockout only. Real validation is in handleSos().
void IRAM_ATTR onSosPress() {
  uint32_t now = millis();
  if (now - sosIsrLastMs > ISR_LOCKOUT_MS) {
    sosIsrLastMs = now;
    sosIsrFlag = true;
  }
}

// ======================== GPS ==========================
void readGps() {
  while (gpsSerial.available()) gps.encode(gpsSerial.read());  // drain every loop
}

bool hasGoodFix() {
  return gps.location.isValid() && gps.location.age() < 3000 &&
         gps.satellites.isValid() && gps.satellites.value() >= 4 &&
         gps.hdop.isValid() && gps.hdop.hdop() < 5.0;
}

// ======================== SOS ==========================
void handleSos() {
  uint32_t now = millis();

  if (sosIsrFlag) {                       // 1) ISR saw a falling edge
    sosIsrFlag = false;
    sosConfirming = true;
    sosConfirmAt = now + CONFIRM_MS;
  }

  if (sosConfirming && (int32_t)(now - sosConfirmAt) >= 0) {   // 2) re-check pin later
    sosConfirming = false;
    if (digitalRead(PIN_SOS) == LOW) {    // still pressed -> real press, not EMI glitch
      sosCount++;
      sosActive = true;
      sosPendingDelivery = true;          // stays set until a packet is actually sent
      forcePublish = true;                // send immediately, don't wait for the timer
      Serial.printf("[SOS] Confirmed press #%lu\n", (unsigned long)sosCount);
    }
  }

  // Expire only AFTER delivery + window, so an offline SOS is never lost.
  if (sosActive && !sosPendingDelivery && (int32_t)(now - sosUntil) >= 0) {
    sosActive = false;
    Serial.println("[SOS] Window ended");
  }
}

// ====================== NETWORK ========================
void maintainWifi() {
  if (WiFi.status() == WL_CONNECTED) { wifiBackoff = BACKOFF_MIN; return; }
  uint32_t now = millis();
  if (now - lastWifiAttempt >= wifiBackoff) {
    lastWifiAttempt = now;
    Serial.printf("[WiFi] Connecting (next retry in %lu ms)...\n", (unsigned long)wifiBackoff);
    WiFi.disconnect();
    WiFi.begin(WIFI_SSID, WIFI_PASS);
    wifiBackoff = min<uint32_t>(wifiBackoff * 2, BACKOFF_MAX);   // exponential backoff
  }
}

void maintainMqtt() {
  if (WiFi.status() != WL_CONNECTED) return;
  if (mqtt.connected()) { mqtt.loop(); return; }

  uint32_t now = millis();
  if (now - lastMqttAttempt < mqttBackoff) return;
  lastMqttAttempt = now;

  // Last-Will: broker publishes "offline" (retained) if we vanish ungracefully.
  if (mqtt.connect(DEVICE_ID, nullptr, nullptr, topicStatus, 1, true, "offline")) {
    mqtt.publish(topicStatus, "online", true);
    mqttBackoff = 2000;
    Serial.println("[MQTT] Connected");
  } else {
    mqttBackoff = min<uint32_t>(mqttBackoff * 2, BACKOFF_MAX);
    Serial.printf("[MQTT] Failed rc=%d, retry in %lu ms\n", mqtt.state(), (unsigned long)mqttBackoff);
  }
}

void publishTelemetry() {
  if (!mqtt.connected()) return;
  uint32_t now = millis();
  uint32_t interval = sosActive ? TELEMETRY_SOS_MS : TELEMETRY_MS;
  if (!forcePublish && (now - lastPublish < interval)) return;

  const bool fix = hasGoodFix();
  JsonDocument doc;                                   // ArduinoJson v7
  doc["id"]  = DEVICE_ID;
  doc["fix"] = fix;
  if (fix) {   // serialized(String(..,6)) keeps all 6 decimals (~0.1 m)
    doc["lat"] = serialized(String(gps.location.lat(), 6));
    doc["lng"] = serialized(String(gps.location.lng(), 6));
  } else {
    doc["lat"] = nullptr;
    doc["lng"] = nullptr;
  }
  doc["spd"]  = gps.speed.isValid() ? gps.speed.kmph() : 0.0;
  doc["sat"]  = gps.satellites.isValid() ? (int)gps.satellites.value() : 0;
  doc["hdop"] = gps.hdop.isValid() ? gps.hdop.hdop() : 99.9;
  doc["age"]  = gps.location.isValid() ? (long)gps.location.age() : -1L;
  doc["sos"]   = sosActive;
  doc["sos_n"] = sosCount;
  doc["rssi"]  = WiFi.RSSI();
  doc["up"]    = now / 1000;

  char buf[320];
  size_t n = serializeJson(doc, buf, sizeof(buf));
  bool ok = mqtt.publish(topicTelemetry, (const uint8_t*)buf, n, false);

  if (ok) {
    lastPublish = now;
    forcePublish = false;
    if (sosActive && sosPendingDelivery) {            // SOS packet really left the device
      sosPendingDelivery = false;
      sosUntil = now + SOS_WINDOW_MS;
    }
    Serial.printf("[TX] %s\n", buf);
  } else {
    Serial.println("[TX] publish failed (will retry)");
  }
}

// ==================== LED / DEBUG ======================
void updateLed() {
  uint32_t period;                                   // 0 = solid ON
  if (sosActive)                         period = 100;   // frantic: SOS
  else if (WiFi.status() != WL_CONNECTED) period = 250;  // fast: no Wi-Fi
  else if (!hasGoodFix())                 period = 1000; // slow: waiting for GPS
  else                                    period = 0;    // solid: all good
  digitalWrite(PIN_LED, period == 0 ? HIGH : ((millis() / period) & 1));
}

void debugPrint() {
  uint32_t now = millis();
  if (now - lastDebug < DEBUG_MS) return;
  lastDebug = now;
  Serial.printf("[DBG] wifi=%d mqtt=%d sats=%d hdop=%.1f fix=%d chars=%lu sentOK=%lu badCRC=%lu\n",
                WiFi.status() == WL_CONNECTED, mqtt.connected(),
                gps.satellites.isValid() ? (int)gps.satellites.value() : 0,
                gps.hdop.isValid() ? gps.hdop.hdop() : 99.9,
                hasGoodFix(),
                (unsigned long)gps.charsProcessed(),
                (unsigned long)gps.passedChecksum(),
                (unsigned long)gps.failedChecksum());
  if (now > 5000 && gps.charsProcessed() < 10)
    Serial.println("[DBG] !! No NMEA data from GPS: check wiring (TX/RX swapped?) and power");
}

// ======================== SETUP ========================
void setup() {
  Serial.begin(115200);
  pinMode(PIN_LED, OUTPUT);
  pinMode(PIN_SOS, INPUT_PULLUP);
  attachInterrupt(digitalPinToInterrupt(PIN_SOS), onSosPress, FALLING);

  gpsSerial.setRxBufferSize(1024);   // survive brief blocking in MQTT/Wi-Fi connect (before begin!)
  gpsSerial.begin(GPS_BAUD, SERIAL_8N1, PIN_GPS_RX, PIN_GPS_TX);

  snprintf(topicTelemetry, sizeof(topicTelemetry), "childsafe/%s/telemetry", DEVICE_ID);
  snprintf(topicStatus,    sizeof(topicStatus),    "childsafe/%s/status",    DEVICE_ID);

  WiFi.mode(WIFI_STA);
  WiFi.persistent(false);            // don't wear out flash with credentials
  WiFi.begin(WIFI_SSID, WIFI_PASS);
  lastWifiAttempt = millis();

  mqtt.setServer(MQTT_HOST, MQTT_PORT);
  mqtt.setBufferSize(512);
  mqtt.setKeepAlive(30);
  mqtt.setSocketTimeout(3);          // cap blocking time of connect() to ~3 s

  Serial.println("\n[BOOT] ChildSafe Tracker started");
}

// ======================== LOOP =========================
void loop() {
  readGps();
  handleSos();
  maintainWifi();
  maintainMqtt();
  publishTelemetry();
  updateLed();
  debugPrint();
}